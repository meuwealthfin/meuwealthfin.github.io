<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WealthFin</title>
<style>
:root{--or:#F2A516;--or2:#DE9200;--bg:#F6F6F7;--card:#fff;--tx:#1d1d1f;--mu:#6b6b76;--bd:#ebebef;--gr:#16a34a;--rd:#dc2626;--bl:#2563eb;--sel:#f1f1f3}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select{font:inherit}
.app{display:flex;min-height:100vh}
aside{width:224px;flex-shrink:0;background:#fff;border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;padding:2px 8px 16px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--or);display:grid;place-items:center}
.logo i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4}
.btn-new{background:var(--or);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:600;cursor:pointer;margin-bottom:14px;width:100%}
.btn-new:hover{background:var(--or2)}
.btn-imp{background:#fff;color:var(--or2);border:1px solid var(--or);border-radius:8px;padding:8px;font-weight:600;cursor:pointer;margin:-6px 0 14px;width:100%}
.btn-imp:hover{background:#fff8e8}
.modal.wide{max-width:980px}
.drop{display:block;border:2px dashed #e3c98a;background:#fffbf2;border-radius:12px;padding:22px;text-align:center;cursor:pointer;margin-bottom:12px}
.drop.on{background:#fff1cf;border-color:var(--or)}
.drop .mu{font-size:12.5px;margin-top:4px}
table.imp td{padding:4px 4px}
table.imp input,table.imp select{border:1px solid var(--bd);border-radius:6px;padding:5px 6px;background:#fff;width:100%;font-size:13px}
table.imp input[type=checkbox]{width:auto}
table.imp tr.off td{opacity:.45}
.st{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--sel);margin-bottom:10px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#333;text-decoration:none;cursor:pointer;margin-bottom:2px;white-space:nowrap}
nav a:hover{background:#f7f7f8}
nav a.on{background:var(--sel);font-weight:600}
nav a svg{width:16px;height:16px;stroke:#555;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:2px}
.side-foot button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:6px;color:var(--mu);cursor:pointer;font-size:12.5px}
.side-foot button:hover{background:#f7f7f8;color:var(--tx)}
main{flex:1;min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}
.mes{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:4px}
.mes button{border:0;background:none;cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:16px}
.mes button:hover{background:var(--sel)}
.mes span{min-width:130px;text-align:center;font-weight:600}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .l{color:var(--mu);font-size:12.5px;margin-bottom:6px}
.kpi .v{font-size:20px;font-weight:700}
.kpi .s{font-size:12px;color:var(--mu);margin-top:4px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.mu{color:var(--mu)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:8px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f3f3f5;vertical-align:middle}
td.r,th.r{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#fafafa}
.btn.p{background:var(--or);border-color:var(--or);color:#fff}
.btn.p:hover{background:var(--or2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.d{color:var(--rd)}
.ic{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--mu)}
.ic:hover{background:var(--sel);color:var(--tx)}
.bar{height:8px;background:#f0f0f2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--sel)}
.tag.ok{background:#dcfce7;color:#166534}.tag.wa{background:#fef3c7;color:#92400e}.tag.ba{background:#fee2e2;color:#991b1b}
.empty{color:var(--mu);text-align:center;padding:24px 8px}
.banner{background:#fff8e8;border:1px solid #f6dfa6;border-radius:12px;padding:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--bd);border-radius:8px;padding:7px 10px;background:#fff}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{flex:1;min-width:150px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.lg i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt1{font-size:11px;fill:#6b6b76}.dt2{font-size:14px;font-weight:700;fill:#1d1d1f}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:10.5px;fill:#6b6b76}
.cl{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.cl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ccard{border-radius:12px;padding:16px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.ccard .n{font-weight:700;font-size:15px}.ccard .x{opacity:.85;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.ind{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid #f3f3f5}
.ind:last-child{border-bottom:0}
.inl{width:110px;border:1px solid var(--bd);border-radius:6px;padding:5px 8px;text-align:right}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,30,.38);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow-y:auto}
.ov.hide{display:none}
.modal{background:#fff;border-radius:14px;width:100%;max-width:470px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd)}
.mh b{font-size:16px}.mh button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mu)}
#mbody{padding:16px 18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.err{color:var(--rd);padding:0 18px;font-size:13px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:5px;font-weight:500}
.fld input,.fld select{width:100%;border:1px solid #dcdce2;border-radius:8px;padding:9px 10px;background:#fff}
.fld input[type=color]{height:38px;padding:3px}
.fld input[type=checkbox]{width:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sel);border-radius:9px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--mu)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.hint{font-size:12px;color:var(--mu);margin-top:-4px;margin-bottom:10px}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}.g21,.g12,.g3{grid-template-columns:1fr}}
@media (max-width:820px){
 .btn-imp{width:auto;margin:0;padding:7px 10px;white-space:nowrap}
 .app{flex-direction:column}
 aside{width:100%;height:auto;position:sticky;top:0;z-index:10;flex-direction:row;align-items:center;gap:8px;padding:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}
 .logo{padding:0 6px}.logo span{display:none}
 .btn-new{width:auto;margin:0;padding:8px 10px;white-space:nowrap}
 nav{display:flex;gap:2px}.side-foot{display:none}
 main{padding:16px 12px 60px}
 .g5,.g4,.g2{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.g5,.g4,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/></svg></i><span>WealthFin</span></div>
  <button class="btn-new" onclick="novoLanc()">+ Novo Lançamento</button>
  <button class="btn-imp" onclick="abrirImport()">📎 Importar PDF / print</button>
  <nav id="nav"></nav>
  <div class="side-foot">
   <button onclick="exportar()">⬇ Exportar backup</button>
   <button onclick="document.getElementById('fimp').click()">⬆ Importar backup</button>
   <button onclick="carregarExemplo()">✦ Carregar dados de exemplo</button>
   <button onclick="apagarTudo()">🗑 Apagar todos os dados</button>
   <input type="file" id="fimp" accept=".json" style="display:none" onchange="importar(this)">
  </div>
 </aside>
 <main>
  <div class="top">
   <h1 id="title"></h1>
   <div class="mes"><button onclick="mudaMes(-1)" aria-label="Mês anterior">‹</button><span id="mesLbl"></span><button onclick="mudaMes(1)" aria-label="Próximo mês">›</button></div>
  </div>
  <div id="content"></div>
 </main>
</div>

<div id="ov" class="ov hide" onclick="if(event.target===this)closeModal()">
 <div class="modal"><div class="mh"><b id="mt"></b><button onclick="closeModal()">×</button></div>
 <div id="mbody"></div><div id="merr" class="err"></div><div class="mf" id="mf"></div></div>
</div>

<script>
/* ================= utilidades ================= */
const K='wealthfin_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlK=v=>{v=+v||0;const a=Math.abs(v);if(a>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(a>=1e3)return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';return 'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0})};
const pct=v=>(isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1}):'0')+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f=x=>x.valor)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const ym=d=>String(d).slice(0,7);
function addMonths(m,n){let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+pad(mo)}
function shiftDate(d,n){return addMonths(ym(d),n)+'-'+pad(Math.min(+d.slice(8,10),28))}
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mesLongo=m=>MESES[+m.slice(5,7)-1]+' '+m.slice(0,4);
const mesCurto=m=>MESES[+m.slice(5,7)-1].slice(0,3)+'/'+m.slice(2,4);
const fmtDate=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
function parseNum(s){s=String(s??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
const fmtNum=v=>(v===''||v==null)?'':String(+v).replace('.',',');
const _d=new Date();const HOJE=_d.getFullYear()+'-'+pad(_d.getMonth()+1)+'-'+pad(_d.getDate());
const MES_HOJE=ym(HOJE);

/* ================= dados ================= */
const GRUPOS={essencial:'Essencial',estilo:'Estilo de vida',investimento:'Investimentos',receita:'Receita'};
const CLASSES=['Reserva / Liquidez','Renda Fixa','Tesouro Direto','Fundos','Ações','FIIs','Previdência','Exterior','Cripto','Outros'];
const CORES_CLASSE=['#0ea5e9','#2563eb','#6366f1','#a855f7','#F2A516','#f97316','#14b8a6','#ec4899','#64748b','#94a3b8'];
function defaultData(){
 const c=(nome,tipo,grupo,cor,orc=0)=>({id:uid(),nome,tipo,grupo,cor,orc});
 return {contas:[],cartoes:[],cats:[
  c('Salário','receita','receita','#16a34a'),c('Renda extra','receita','receita','#22c55e'),c('Rendimentos','receita','receita','#4ade80'),c('Outras receitas','receita','receita','#86efac'),
  c('Moradia','despesa','essencial','#2563eb'),c('Contas da casa','despesa','essencial','#3b82f6'),c('Mercado','despesa','essencial','#0ea5e9'),c('Transporte','despesa','essencial','#06b6d4'),c('Saúde','despesa','essencial','#14b8a6'),c('Educação','despesa','essencial','#6366f1'),
  c('Restaurantes','despesa','estilo','#f97316'),c('Lazer','despesa','estilo','#f59e0b'),c('Compras','despesa','estilo','#ec4899'),c('Assinaturas','despesa','estilo','#a855f7'),c('Viagens','despesa','estilo','#ef4444'),c('Cuidados pessoais','despesa','estilo','#d946ef'),c('Outros','despesa','estilo','#94a3b8'),
  c('Investimentos','despesa','investimento','#F2A516')
 ],lanc:[],fixos:[],invest:[],bens:[],dividas:[]};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.cats))S=defaultData();
['contas','cartoes','cats','lanc','fixos','invest','bens','dividas'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

let tab='dashboard', mes=MES_HOJE;
const cat=id=>S.cats.find(c=>c.id===id)||{nome:'Sem categoria',cor:'#cbd5e1',grupo:'estilo',tipo:'despesa'};
const conta=id=>S.contas.find(c=>c.id===id);
const cartao=id=>S.cartoes.find(c=>c.id===id);
const isInv=l=>l.tipo==='despesa'&&cat(l.cat).grupo==='investimento';
const doMes=m=>S.lanc.filter(l=>ym(l.data)===m);
const receitas=m=>sum(doMes(m).filter(l=>l.tipo==='receita'));
const despesas=m=>sum(doMes(m).filter(l=>l.tipo==='despesa'&&!isInv(l)));
const aportes=m=>sum(doMes(m).filter(isInv));
const ultimos=(m,n)=>Array.from({length:n},(_,i)=>addMonths(m,i-n+1));
const media=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
function mediaRec(m){const ms=ultimos(m,3).filter(x=>receitas(x)>0);return media(ms.map(receitas))}
function mediaDesp(m){const ms=ultimos(m,3).filter(x=>despesas(x)>0);return media(ms.map(despesas))}

function saldoConta(id){
 const c=conta(id);let s=+(c&&c.saldoIni)||0;
 for(const l of S.lanc){if(l.data>HOJE)continue;
  if(l.tipo==='receita'&&l.conta===id)s+=l.valor;
  else if(l.tipo==='despesa'&&l.conta===id&&!l.cartao)s-=l.valor;
  else if(l.tipo==='transf'){if(l.conta===id)s-=l.valor;if(l.destino===id)s+=l.valor}
  else if(l.tipo==='pagfat'&&l.conta===id)s-=l.valor;}
 return s;
}
function mesFatura(l){if(l.fat)return l.fat;const k=cartao(l.cartao);if(!k)return ym(l.data);return +l.data.slice(8,10)>=(+k.fech||1)?addMonths(ym(l.data),1):ym(l.data)}
function fatura(id,m){const itens=S.lanc.filter(l=>l.tipo==='despesa'&&l.cartao===id&&mesFatura(l)===m).sort((a,b)=>a.data<b.data?-1:1);
 const total=sum(itens);const pago=sum(S.lanc.filter(l=>l.tipo==='pagfat'&&l.cartao===id&&l.fatura===m));return{itens,total,pago,aberto:Math.max(0,total-pago)}}
function devedorCartao(id){return Math.max(0,sum(S.lanc.filter(l=>l.tipo==='despesa'&&l.cartao===id))-sum(S.lanc.filter(l=>l.tipo==='pagfat'&&l.cartao===id)))}
function vencFatura(k,m){const f=+k.fech||1,v=+k.venc||10;const mv=v>f?m:addMonths(m,1);return mv+'-'+pad(Math.min(v,28))}
function patrimonio(){
 const contas=sum(S.contas,c=>saldoConta(c.id)),inv=sum(S.invest,i=>i.atual),bens=sum(S.bens,b=>b.valor),div=sum(S.dividas,d=>d.saldo),cart=sum(S.cartoes,k=>devedorCartao(k.id));
 return{contas,inv,bens,div,cart,ativos:contas+inv+bens,passivos:div+cart,liquido:contas+inv+bens-div-cart};
}
function parcelasCartaoMes(m){return sum(S.lanc.filter(l=>l.tipo==='despesa'&&l.cartao&&l.parc&&l.parc.n>1&&ym(l.data)===m))}
function dividasMes(m){const k=(+m.slice(0,4)*12+ +m.slice(5,7))-(+MES_HOJE.slice(0,4)*12+ +MES_HOJE.slice(5,7));return sum(S.dividas.filter(d=>k<(+d.restantes||0)&&k>=0),d=>d.parcela)}
const fixosTotal=()=>sum(S.fixos.filter(f=>f.ativo!==false));

/* ================= gráficos ================= */
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function donut(items,size=170){
 items=items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);const tot=sum(items,i=>i.value);
 if(!tot)return'<div class="empty">Sem dados neste período</div>';
 const r=68,c=2*Math.PI*r;let off=0;
 const segs=items.map(i=>{const len=i.value/tot*c;const s=`<circle r="${r}" cx="90" cy="90" fill="none" stroke="${i.color}" stroke-width="24" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(i.label)}: ${brl(i.value)}</title></circle>`;off+=len;return s}).join('');
 const leg=items.slice(0,9).map(i=>`<div class="lg"><i style="background:${i.color}"></i><span title="${esc(i.label)}">${esc(i.label)}</span><b>${pct(i.value/tot)}</b></div>`).join('')+(items.length>9?`<div class="lg mu">+${items.length-9} outras</div>`:'');
 return`<div class="donut"><svg viewBox="0 0 180 180" width="${size}" height="${size}">${segs}<text x="90" y="86" text-anchor="middle" class="dt1">Total</text><text x="90" y="104" text-anchor="middle" class="dt2">${brlK(tot)}</text></svg><div class="legend">${leg}</div></div>`;
}
function bars(labels,series,{stack=false,h=230}={}){
 const W=640,H=h,pl=58,pb=24,pt=10,n=labels.length;
 const mx=niceMax(Math.max(0,...labels.map((_,i)=>stack?sum(series,s=>Math.max(0,s.values[i])):Math.max(...series.map(s=>s.values[i]||0)))));
 const ih=H-pb-pt,cw=(W-pl-8)/n;let g='';
 for(let t=0;t<=4;t++){const y=pt+ih-ih*t/4;g+=`<line x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${brlK(mx*t/4)}</text>`}
 labels.forEach((lb,i)=>{const x0=pl+cw*i;
  if(stack){let acc=0;const bw=cw*.55;series.forEach(s=>{const v=Math.max(0,s.values[i]||0);const hh=v/mx*ih;const y=pt+ih-acc-hh;acc+=hh;if(v>0)g+=`<rect x="${x0+(cw-bw)/2}" y="${y}" width="${bw}" height="${hh}" fill="${s.color}" rx="2"><title>${esc(s.name)} · ${esc(lb)}: ${brl(v)}</title></rect>`})}
  else{const bw=Math.min(26,cw*.78/series.length);const st=x0+(cw-bw*series.length)/2;series.forEach((s,j)=>{const v=Math.max(0,s.values[i]||0);const hh=v/mx*ih;g+=`<rect x="${st+bw*j}" y="${pt+ih-hh}" width="${bw-2}" height="${hh}" fill="${s.color}" rx="2"><title>${esc(s.name)} · ${esc(lb)}: ${brl(v)}</title></rect>`})}
  g+=`<text x="${x0+cw/2}" y="${H-6}" text-anchor="middle">${esc(lb)}</text>`});
 return`<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="cl">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;
}
function ring(score,size=150){const r=60,c=2*Math.PI*r,col=score>=70?'#16a34a':score>=45?'#F2A516':'#dc2626';
 return`<svg viewBox="0 0 150 150" width="${size}" height="${size}"><circle r="${r}" cx="75" cy="75" fill="none" stroke="#f0f0f2" stroke-width="14"/><circle r="${r}" cx="75" cy="75" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#1d1d1f">${Math.round(score)}</text><text x="75" y="100" text-anchor="middle" style="font-size:11px;fill:#6b6b76">de 100</text></svg>`}

function setTipo(t){captureLanc();if(D.tipo!==t){D.tipo=t;D.cat='';if(t!=='despesa'&&D.forma[0]==='k')D.forma=S.contas[0]?'c:'+S.contas[0].id:''}$('#mbody').innerHTML=lancForm()}
function captureLanc(){['data','desc','valor','cat','forma','parcelas','destino'].forEach(k=>{const e=$('#l_'+k);if(e)D[k]=e.value})}
function salvarLanc(){
 captureLanc();const v=Math.round(parseNum(D.valor)*100)/100;
 if(!(v>0))return erro('Informe um valor maior que zero.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(D.data))return erro('Informe uma data válida.');
 const base={tipo:D.tipo,data:D.data,valor:v,desc:(D.desc||'').trim()};
 if(D.tipo==='pagfat'){const o=S.lanc.find(l=>l.id===D._id);Object.assign(o,base);save();render();return true}
 if(D.tipo==='transf'){const o=(D.forma||'').slice(2),d=(D.destino||'').slice(2);if(!o||!d)return erro('Escolha a conta de origem e de destino.');if(o===d)return erro('Origem e destino devem ser contas diferentes.');Object.assign(base,{conta:o,destino:d,cat:'',cartao:null,desc:base.desc||'Transferência'})}
 else{if(!D.cat)return erro('Escolha uma categoria.');base.cat=D.cat;base.desc=base.desc||cat(D.cat).nome;const f=D.forma||'';base.conta=f[0]==='c'?f.slice(2):null;base.cartao=f[0]==='k'?f.slice(2):null;base.destino=null}
 if(D._id){const o=S.lanc.find(l=>l.id===D._id);Object.assign(o,base)}
 else if(base.cartao&&+D.parcelas>1){const n=+D.parcelas,g=uid();const pv=Math.floor(v/n*100)/100;
  for(let i=0;i<n;i++){const val=i===n-1?Math.round((v-pv*(n-1))*100)/100:pv;S.lanc.push({...base,id:uid(),data:shiftDate(base.data,i),valor:val,desc:`${base.desc} (${i+1}/${n})`,parc:{i:i+1,n,g}})}}
 else S.lanc.push({...base,id:uid()});
 save();render();return true;
}

function diagnostico(){
 const rm=mediaRec(mes),dm=mediaDesp(mes);const ind=[];
 const lerp=(v,a,b)=>Math.max(0,Math.min(100,(v-a)/(b-a)*100));
 const add=(nome,v,vtxt,meta,score,dica)=>ind.push({nome,v,vtxt,meta,score,st:score>=70?'ok':score>=40?'wa':'ba',dica});
 const poup=rm?(rm-dm)/rm:0;
 add('Taxa de poupança',poup,pct(poup),'Ideal: 20% ou mais da renda',rm?lerp(poup,0,.2):0,poup>=.2?'Ótimo! Você está guardando uma boa parte da renda. Garanta que a sobra seja investida.':poup>=.1?'Razoável. Revise gastos de estilo de vida para chegar a 20%.':'Atenção: sobra pouco (ou falta) no fim do mês. Use a aba Orçamento para definir limites.');
 const liq=sum(S.contas,c=>Math.max(0,saldoConta(c.id)))+sum(S.invest.filter(i=>i.liquidez),i=>i.atual);const res=dm?liq/dm:0;
 add('Reserva de emergência',res,res.toLocaleString('pt-BR',{maximumFractionDigits:1})+' meses','Ideal: 6 meses de despesas',dm?lerp(res,0,6):0,res>=6?'Reserva completa. O excedente pode buscar investimentos de maior retorno.':`Meta: ${brl(dm*6)} em aplicações de liquidez diária (faltam ${brl(Math.max(0,dm*6-liq))}).`);
 const pd=rm?(parcelasCartaoMes(mes)+dividasMes(mes))/rm:0;
 add('Comprometimento com parcelas',pd,pct(pd),'Ideal: até 15% da renda',rm?100-lerp(pd,.15,.45):0,pd<=.15?'Parcelas sob controle.':'Evite novas compras parceladas até reduzir este percentual. Priorize quitar dívidas com juros mais altos.');
 const fx=rm?fixosTotal()/rm:0;
 add('Despesas fixas',fx,pct(fx),'Ideal: até 50% da renda',rm?100-lerp(fx,.5,.8):0,fx<=.5?'Custo fixo saudável — dá flexibilidade ao orçamento.':'Custos fixos altos reduzem sua margem. Renegocie contratos (planos, assinaturas, seguros).');
 const co=S.cats.filter(c=>c.tipo==='despesa'&&c.orc>0);
 if(co.length){const ok=co.filter(c=>gastoCat(c.id,mes)<=c.orc).length/co.length;add('Orçamento respeitado',ok,pct(ok)+' das categorias','Ideal: 100% dentro do limite',ok*100,ok>=.9?'Disciplina excelente no orçamento.':'Categorias estouradas: '+co.filter(c=>gastoCat(c.id,mes)>c.orc).map(c=>c.nome).join(', ')+'.')}
 const at=sum(S.invest,i=>i.atual);
 if(at>0){const byC={};S.invest.forEach(i=>byC[i.classe]=(byC[i.classe]||0)+(+i.atual||0));const mx=Math.max(...Object.values(byC))/at,n=Object.keys(byC).length;
  add('Diversificação',mx,n+' classes · maior '+pct(mx),'Ideal: nenhuma classe acima de 60%',Math.min(100,lerp(n,1,4)*.5+(100-lerp(mx,.4,1))*.5),mx<=.6?'Carteira bem distribuída.':'Concentração alta em uma classe. Avalie diversificar conforme seu perfil.')}
 const p=patrimonio();const en=p.ativos?p.passivos/p.ativos:0;
 add('Endividamento',en,pct(en)+' dos ativos','Ideal: abaixo de 30%',p.ativos?100-lerp(en,.3,.8):0,en<=.3?'Nível de endividamento confortável.':'Passivos altos em relação aos ativos. Priorize amortizar dívidas.');
 return{ind,score:ind.length?media(ind.map(i=>i.score)):0,rm,dm};
}
function pgDiag(){
 const d=diagnostico();
 if(!d.rm)return`<div class="card"><div class="empty">Lance suas receitas e despesas para gerar o diagnóstico.</div></div>`;
 const txt=d.score>=70?'Suas finanças estão saudáveis.':d.score>=45?'Suas finanças estão razoáveis, com pontos de atenção.':'Suas finanças precisam de atenção.';
 return`<div class="grid g12"><div class="card" style="text-align:center"><h3 style="justify-content:center">Nota de saúde financeira</h3>${ring(d.score,170)}<p><b>${txt}</b></p><p class="mu" style="font-size:12.5px">Baseado nos últimos 3 meses até ${mesLongo(mes)}.<br>Renda média ${brl(d.rm)} · Despesa média ${brl(d.dm)}</p></div>
 <div class="card"><h3>Indicadores</h3>${d.ind.map(i=>`<div class="ind"><div><b>${i.nome}</b><div class="mu" style="font-size:12px">${i.meta}</div></div><div style="text-align:right"><span class="tag ${i.st}">${i.vtxt}</span></div><div style="grid-column:1/-1">${barra(i.score/100,i.st==='ok'?'#16a34a':i.st==='wa'?'#F2A516':'#dc2626')}<div style="font-size:12.5px;margin-top:6px">${esc(i.dica)}</div></div></div>`).join('')}</div></div>`;
}

];
function chave(d){return norm(d).replace(/\(?\d+\s*\/\s*\d+\)?/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().slice(0,14)}
function guessCat(desc,tipo){
 const k=chave(desc);
 if(k.length>=3){const h=sortDesc(S.lanc).find(l=>l.cat&&l.tipo===tipo&&chave(l.desc)===k);if(h)return h.cat}
 const n=norm(desc);
 for(const[re,nome]of REGRAS)if(re.test(n)){const c=S.cats.find(c=>c.nome===nome&&c.tipo===tipo);if(c)return c.id}
 return'';
}
function parseLinhas(lines){
 const out=[];
 for(const raw of lines){
  const t=String(raw).replace(/\s+/g,' ').trim();if(t.length<6)continue;
  const n=norm(t);
  if(/\b(saldo|total|subtotal|limite|resumo|valor minimo|pagamento minimo|vencimento|melhor dia|taxa de juros|cet|proxima fatura|fatura anterior)\b/.test(n))continue;
  const cands=[];
  const r1=/(^|[^\d,.])(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{4}|\d{2}))?(?![\d,])/.exec(t);
  if(r1){const d=+r1[2],m=+r1[3];if(d>=1&&d<=31&&m>=1&&m<=12)cands.push({i:r1.index+r1[1].length,l:r1[0].length-r1[1].length,d,m,y:r1[4]?(r1[4].length===2?2000+ +r1[4]:+r1[4]):null})}
  const r2=/(^|[^a-z\d])(\d{1,2})\s*(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?(?:\s*(?:de\s*)?(\d{4}))?(?![a-z])/i.exec(t);
  if(r2){const d=+r2[2];if(d>=1&&d<=31)cands.push({i:r2.index+r2[1].length,l:r2[0].length-r2[1].length,d,m:MESN[r2[3].toLowerCase()],y:r2[4]?+r2[4]:null})}
  if(!cands.length)continue;
  const dt=cands.sort((a,b)=>a.i-b.i)[0];
  const re=/(?:(-|−)\s?)?(?:R\$|US\$)?\s?(-|−)?(\d{1,3}(?:\.\d{3})+|\d+),(\d{2})(?!\d)(\s?(-|D\b|C\b))?/g;let vm=null,m;
  while((m=re.exec(t))){if(m.index>=dt.i+dt.l||m.index+m[0].length<=dt.i)vm=m}
  if(!vm)continue;
  const v=parseFloat(vm[3].replace(/\./g,'')+'.'+vm[4]);if(!(v>0)||v>1e7)continue;
  const neg=!!(vm[1]||vm[2]||vm[6]==='-'||vm[6]==='D');
  const spans=[[dt.i,dt.l],[vm.index,vm[0].length]].sort((a,b)=>b[0]-a[0]);let desc=t;
  spans.forEach(([i,l])=>{desc=desc.slice(0,i)+' '+desc.slice(i+l)});
  desc=desc.replace(/R\$|US\$/g,' ').replace(/\s+/g,' ').replace(/^[\s\-–:|*•.]+|[\s\-–:|*•]+$/g,'').trim();
  if(desc.length<2)continue;
  out.push({dd:dt.d,mm:dt.m,yy:dt.y,desc,raw:neg?-v:v,sinal:vm[6]==='C'?'C':vm[6]==='D'?'D':''});
 }
 return out;
}
function impClass(){
 const isK=IMP.dest[0]==='k',id=IMP.dest.slice(2),ref=isK?IMP.fat:mes;
 const ry=+ref.slice(0,4),rm=+ref.slice(5,7);
 IMP.items.forEach((it,ix)=>{
  let y=it.yy||(it.mm>rm?ry-1:ry);it.data=y+'-'+pad(it.mm)+'-'+pad(Math.min(it.dd,new Date(y,it.mm,0).getDate()));
  const n=norm(it.desc);it.aviso='';it.ok=true;
  if(isK){
   it.tipo='despesa';
   const est=it.raw<0||/estorno|cashback|reembolso|credito de|ajuste a credito/.test(n);
   it.valor=est?-Math.abs(it.raw):Math.abs(it.raw);
   if(/pagamento|pgto|pagto/.test(n)&&!/parcela/.test(n)){it.ok=false;it.aviso='Pagamento da fatura (não é gasto)'}
   else if(est){it.ok=false;it.aviso='Estorno/crédito — se marcar, entra como desconto na fatura'}
   const p=/(?:parc(?:ela)?\.?\s*)?\b(\d{1,2})\s*\/\s*(\d{1,2})\b/.exec(it.desc);
   if(p&&+p[1]>=1&&+p[2]>=2&&+p[1]<=+p[2]&&+p[2]<=48){it.parc={i:+p[1],n:+p[2]};if(+p[1]>1)it.data=IMP.fat+'-'+pad(Math.min(it.dd,28))}
  }else{
   it.valor=Math.abs(it.raw);
   const rec=it.sinal==='C'||(!(it.raw<0)&&it.sinal!=='D'&&/receb|salario|credito|rendiment|deposito|estorno|reembolso|resgate|proventos|dividendo/.test(n));
   it.tipo=rec?'receita':'despesa';
  }
  it.cat=guessCat(it.desc,it.tipo);
  const dup=S.lanc.some(l=>l.data===it.data&&Math.abs(Math.abs(l.valor)-Math.abs(it.valor))<.005&&(isK?l.cartao===id:(l.conta===id&&!l.cartao)));
  const dupB=IMP.items.slice(0,ix).some(o=>o.data===it.data&&o.valor===it.valor&&o.desc===it.desc);
  if(dup||dupB){it.ok=false;it.aviso='Possível duplicado — já existe um lançamento igual'}
 });
}
function abrirImport(){
 if(!S.contas.length&&!S.cartoes.length){openModal('Importar fatura / extrato','<p style="margin:0">Cadastre primeiro uma conta (aba <b>Contas</b>) ou um cartão (aba <b>Cartões</b>) para saber onde lançar.</p>',null);return}
 IMP={open:true,dest:S.cartoes[0]?'k:'+S.cartoes[0].id:'c:'+S.contas[0].id,fat:mes,items:[],status:'',pend:[]};
 openModal('Importar fatura / extrato',impForm(),impConfirmar,'Importar selecionados');
 $('.modal').classList.add('wide');
}
const impRender=()=>{if(IMP&&IMP.open)$('#mbody').innerHTML=impForm()};
function impStatus(t){if(!IMP)return;IMP.status=t;const e=$('#imp_st');if(e){e.style.display=t?'':'none';e.innerHTML=t}}
function impForm(){
 const isK=IMP.dest[0]==='k';
 let h=`<div class="f2"><div class="fld"><label>Lançar em</label><select onchange="IMP.dest=this.value;impClass();impRender()">${formaOpts(false,false).map(([a,b])=>`<option value="${a}"${IMP.dest===a?' selected':''}>${esc(b)}</option>`).join('')}</select></div>
 ${isK?`<div class="fld"><label>Fatura de (mês)</label><input type="month" value="${IMP.fat}" onchange="if(this.value){IMP.fat=this.value;impClass();impRender()}"></div>`:'<div class="fld"><label>&nbsp;</label><div class="hint" style="margin:8px 0 0">Extrato de conta: débitos viram despesas e créditos viram receitas.</div></div>'}</div>
 <label class="drop" ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="event.preventDefault();this.classList.remove('on');impArquivos(event.dataTransfer.files)"><input type="file" multiple accept=".pdf,application/pdf,image/*" style="display:none" onchange="impArquivos(this.files);this.value=''"><b>📎 Clique para escolher PDFs ou prints</b><div class="mu">ou arraste os arquivos aqui · no computador, também dá para colar um print com Ctrl+V</div></label>`;
 if(IMP.pend.length)h+=`<div class="fld"><label>🔒 O PDF “${esc(IMP.pend[0].name)}” tem senha (em faturas, costuma ser parte do CPF)</label><div style="display:flex;gap:8px"><input id="imp_pass" type="password" onkeydown="if(event.key==='Enter')impSenha()"><button class="btn p" onclick="impSenha()">Abrir</button><button class="btn" onclick="IMP.pend.shift();impRender()">Pular</button></div></div>`;
 h+=`<div id="imp_st" class="st" style="${IMP.status?'':'display:none'}">${IMP.status}</div>`;
 if(IMP.items.length){
  h+=`<div class="row" style="flex-wrap:wrap"><span id="imp_sum">${impSum()}</span><span style="display:flex;gap:6px"><button class="btn sm" onclick="IMP.items.forEach(i=>i.ok=true);impRender()">Marcar todos</button><button class="btn sm" onclick="IMP.items.forEach(i=>i.ok=false);impRender()">Desmarcar</button><button class="btn sm d" onclick="IMP.items=[];impStatus('');impRender()">Limpar</button></span></div>
  <div class="tw" style="max-height:52vh;overflow:auto"><table class="imp"><thead><tr><th></th><th style="width:130px">Data</th><th>Descrição</th><th style="width:170px">Categoria</th>${isK?'':'<th style="width:110px">Tipo</th>'}<th class="r" style="width:110px">Valor (R$)</th><th></th></tr></thead><tbody>${IMP.items.map((it,i)=>`<tr class="${it.ok?'':'off'}" id="imp_r${i}">
   <td><input type="checkbox"${it.ok?' checked':''} onchange="IMP.items[${i}].ok=this.checked;$('#imp_r${i}').className=this.checked?'':'off';$('#imp_sum').innerHTML=impSum()"></td>
   <td><input type="date" value="${it.data}" onchange="IMP.items[${i}].data=this.value"></td>
   <td><input value="${esc(it.desc)}" onchange="IMP.items[${i}].desc=this.value">${it.aviso?`<div class="hint" style="margin:3px 0 0;color:#92400e">${esc(it.aviso)}</div>`:''}</td>
   <td><select onchange="IMP.items[${i}].cat=this.value">${catOpts(it.tipo).map(([a,b])=>`<option value="${a}"${it.cat===a?' selected':''}>${a?esc(b):'— sem categoria —'}</option>`).join('')}</select></td>
   ${isK?'':`<td><select onchange="IMP.items[${i}].tipo=this.value;IMP.items[${i}].cat=guessCat(IMP.items[${i}].desc,this.value);impRender()"><option value="despesa"${it.tipo==='despesa'?' selected':''}>Despesa</option><option value="receita"${it.tipo==='receita'?' selected':''}>Receita</option></select></td>`}
   <td><input style="text-align:right" inputmode="decimal" value="${(+it.valor).toFixed(2).replace('.',',')}" onchange="IMP.items[${i}].valor=parseNum(this.value);$('#imp_sum').innerHTML=impSum()"></td>
   <td><button class="ic" title="Remover" onclick="IMP.items.splice(${i},1);impRender()">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div class="hint" style="margin-top:8px">Confira as linhas antes de importar. As categorias que você escolher aqui são lembradas nas próximas importações.</div>`;
 }
 return h;
}
function impSum(){const s=IMP.items.filter(i=>i.ok);const sc=s.filter(i=>!i.cat).length;return`<b>${s.length}</b> de ${IMP.items.length} selecionados · total <b>${brl(sum(s.filter(i=>i.tipo==='despesa')))}</b>${sum(s.filter(i=>i.tipo==='receita'))?` em despesas · <b class="pos">${brl(sum(s.filter(i=>i.tipo==='receita')))}</b> em receitas`:''}${sc?` · <span style="color:#92400e">${sc} sem categoria</span>`:''}`}
function loadScript(src){return new Promise((ok,err)=>{const ex=document.querySelector(`script[src="${src}"]`);if(ex&&ex.dataset.ok)return ok();const s=ex||document.createElement('script');s.src=src;s.onload=()=>{s.dataset.ok=1;ok()};s.onerror=()=>err(new Error('Não foi possível carregar o leitor (verifique a internet).'));if(!ex)document.head.appendChild(s)})}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfLib(){await loadScript(PDFJS+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return pdfjsLib}
async function ocr(img,rotulo){
 await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
 impStatus(`🔎 Lendo ${esc(rotulo)}… (a primeira leitura de imagem baixa o leitor e pode levar ~30s)`);
 const r=await Tesseract.recognize(img,'por',{logger:m=>{if(m.status==='recognizing text')impStatus(`🔎 Lendo ${esc(rotulo)}… ${Math.round(m.progress*100)}%`)}});
 return r.data.text.split('\n');
}
async function pdfLines(file,password){
 const lib=await pdfLib();
 const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password}).promise;
 const lines=[];
 for(let p=1;p<=doc.numPages;p++){
  impStatus(`📄 Lendo ${esc(file.name)} — página ${p} de ${doc.numPages}…`);
  const pg=await doc.getPage(p);const tc=await pg.getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,its:[]};rows.push(r)}r.its.push({x,s:it.str})});
  const pl=rows.sort((a,b)=>b.y-a.y).map(r=>r.its.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim());
  if(pl.join('').length<30){const vp=pg.getViewport({scale:2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;lines.push(...await ocr(cv,`${file.name} (pág. ${p}, PDF escaneado)`))}
  else lines.push(...pl);
 }
 return lines;
}
async function impArquivos(files,password){
 files=Array.from(files||[]);if(!files.length)return;
 let novos=0;
 for(let fi=0;fi<files.length;fi++){const f=files[fi];
  try{
   const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');
   if(!isPdf&&!/^image\//.test(f.type)){impStatus(`⚠️ “${esc(f.name)}” não é PDF nem imagem.`);continue}
   const lines=isPdf?await pdfLines(f,password):await ocr(f,f.name||'print');
   const its=parseLinhas(lines);IMP.items.push(...its);novos+=its.length;
  }catch(e){
   if(e&&e.name==='PasswordException'){if(password)impStatus('🔒 Senha incorreta. Tente de novo.');IMP.pend=[f].concat(files.slice(fi+1)).concat(IMP.pend.filter(x=>!files.includes(x)));impClass();impRender();return}
   console.error(e);impStatus(`⚠️ Não consegui ler “${esc(f.name)}”: ${esc(e.message||e)}`);
  }
 }
 if(!IMP||!IMP.open)return;
 impClass();
 IMP.status=novos?`✅ ${novos} lançamento(s) encontrados. Revise abaixo e clique em <b>Importar selecionados</b>.`:(IMP.status&&IMP.status.startsWith('⚠️')?IMP.status:'⚠️ Não encontrei lançamentos (linhas com data e valor). Tente outro arquivo ou um print mais nítido.');
 impRender();
}
function impSenha(){const pw=$('#imp_pass').value;if(!pw)return;const fs=IMP.pend.slice();IMP.pend=[];impArquivos([fs[0]],pw).then(()=>{if(fs.length>1&&IMP&&IMP.open&&!IMP.pend.length)impArquivos(fs.slice(1))})}
function impConfirmar(){
 const sel=IMP.items.filter(i=>i.ok);if(!sel.length)return erro('Nenhum lançamento selecionado.');
 const bad=sel.find(i=>!/^\d{4}-\d{2}-\d{2}$/.test(i.data)||!i.valor);if(bad)return erro('Há linha selecionada com data ou valor inválido: '+bad.desc);
 const isK=IMP.dest[0]==='k',id=IMP.dest.slice(2);
 sel.forEach(it=>{const l={id:uid(),tipo:it.tipo,data:it.data,valor:Math.round(it.valor*100)/100,desc:it.desc.trim()||cat(it.cat).nome,cat:it.cat,conta:isK?null:id,cartao:isK?id:null,destino:null,imp:1};if(isK)l.fat=IMP.fat;S.lanc.push(l)});
 save();const n=sel.length,onde=isK?'na fatura '+mesLongo(IMP.fat)+' do cartão '+cartao(id).nome:'na conta '+conta(id).nome;
 if(isK&&ym(IMP.fat)!==mes)mes=IMP.fat;
 render();closeModal();openModal('Importação concluída',`<p style="margin:0">✅ ${n} lançamento(s) importado(s) ${esc(onde)}.</p>`,null);return false;
}
document.addEventListener('paste',e=>{if(!IMP||!IMP.open)return;const fs=Array.from(e.clipboardData&&e.clipboardData.files||[]).filter(f=>/^image\/|pdf/.test(f.type));if(fs.length){e.preventDefault();impArquivos(fs)}});
</script>
